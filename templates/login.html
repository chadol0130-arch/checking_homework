<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>로그인 - Homework Checker</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 0;
      }

      .login-button {
        background: #4c6fff;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(76, 111, 255, 0.3);
        transition: background 0.2s;
      }
      .login-button:hover {
        background: #3a5eef;
      }

      .login-popup {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 20vh;
        min-height: 300px;
        background: rgba(0, 0, 0, 0.5);
        z-index: 2000;
        justify-content: center;
        align-items: flex-start;
        padding-top: 20px;
      }
      .login-popup.active {
        display: flex;
      }
      .login-popup-content {
        background: white;
        border-radius: 16px;
        padding: 24px;
        width: 90%;
        max-width: 400px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        animation: slideDown 0.3s ease;
      }
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .login-popup-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .login-popup-header h2 {
        margin: 0;
        font-size: 24px;
      }
      .close-button {
        background: none;
        border: none;
        font-size: 32px;
        color: #666;
        cursor: pointer;
        padding: 0;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }
      .close-button:hover {
        color: #333;
      }
      .login-form {
        display: grid;
        gap: 16px;
        margin-bottom: 20px;
      }
      .form-group {
        display: grid;
        gap: 8px;
      }
      .form-group label {
        font-size: 14px;
        font-weight: 600;
        color: #333;
      }
      .form-group input {
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
      }
      .form-group input:focus {
        outline: none;
        border-color: #4c6fff;
      }
      .login-submit-button {
        background: #4c6fff;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
      }
      .login-submit-button:hover {
        background: #3a5eef;
      }
      .login-actions {
        display: grid;
        gap: 12px;
      }
      .action-button {
        background: #f2f2f2;
        color: #333;
        border: none;
        padding: 10px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      .action-button:hover {
        background: #e0e0e0;
      }
      .find-actions {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      .find-button {
        background: none;
        border: none;
        color: #4c6fff;
        padding: 8px 12px;
        font-size: 13px;
        cursor: pointer;
        text-decoration: underline;
      }
      .find-button:hover {
        color: #3a5eef;
      }

      .signup-popup {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 20vh;
        min-height: 400px;
        background: rgba(0, 0, 0, 0.5);
        z-index: 2001;
        justify-content: center;
        align-items: flex-start;
        padding-top: 20px;
      }
      .signup-popup.active {
        display: flex;
      }
      .signup-popup-content {
        background: white;
        border-radius: 16px;
        padding: 24px;
        width: 90%;
        max-width: 400px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        animation: slideDown 0.3s ease;
        max-height: 90vh;
        overflow-y: auto;
      }
      .error-message {
        color: #c00;
        font-size: 13px;
        margin-top: 4px;
      }
      .success-message {
        color: #0a0;
        font-size: 13px;
        margin-top: 4px;
      }
      .loading {
        opacity: 0.6;
        pointer-events: none;
      }
      .hint {
        color: #666;
        font-size: 12px;
        margin-top: 4px;
      }
      .google-signin-button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: white;
        color: #333;
        border: 1px solid #ddd;
        padding: 12px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        margin-top: 12px;
        transition: background 0.2s;
      }
      .google-signin-button:hover {
        background: #f5f5f5;
      }
      .google-signin-button img {
        width: 20px;
        height: 20px;
      }
      .divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 20px 0;
        color: #999;
        font-size: 14px;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid #ddd;
      }
      .divider span {
        padding: 0 12px;
      }
    </style>
  </head>
  <body>
    <div style="position: fixed; top: 24px; right: 24px; z-index: 1000;">
      <button id="login-btn" class="login-button">로그인</button>
    </div>

    <div id="login-popup" class="login-popup">
      <div class="login-popup-content">
        <div class="login-popup-header">
          <h2>로그인</h2>
          <button id="close-login-popup" class="close-button">×</button>
        </div>
        <form id="login-form" class="login-form">
          <div class="form-group">
            <label for="login-id">이메일</label>
            <input type="email" id="login-id" name="id" required />
          </div>
          <div class="form-group">
            <label for="login-password">비밀번호</label>
            <input type="password" id="login-password" name="password" required />
          </div>
          <div id="login-error" class="error-message" style="display: none;"></div>
          <button type="submit" class="login-submit-button">로그인</button>

          <div class="divider">
            <span>또는</span>
          </div>

          <button type="button" id="google-login-btn" class="google-signin-button">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            구글로 로그인
          </button>
        </form>
        <div class="login-actions">
          <button type="button" id="signup-btn" class="action-button">회원가입</button>
          <div class="find-actions">
            <button id="find-id-btn" class="find-button">아이디 찾기</button>
            <button id="find-password-btn" class="find-button">비밀번호 찾기</button>
          </div>
        </div>
      </div>
    </div>

    <div id="signup-popup" class="signup-popup">
      <div class="signup-popup-content">
        <div class="login-popup-header">
          <h2>회원가입</h2>
          <button id="close-signup-popup" class="close-button">×</button>
        </div>
        <form id="signup-form" class="login-form">
          <div class="form-group">
            <label for="signup-email">이메일</label>
            <input type="email" id="signup-email" name="email" required />
          </div>
          <div class="form-group">
            <label for="signup-password">비밀번호</label>
            <input type="password" id="signup-password" name="password" required minlength="6" />
            <span class="hint">비밀번호는 최소 6자 이상이어야 합니다.</span>
          </div>
          <div class="form-group">
            <label for="signup-password-confirm">비밀번호 확인</label>
            <input type="password" id="signup-password-confirm" name="password-confirm" required />
          </div>
          <div id="signup-error" class="error-message" style="display: none;"></div>
          <div id="signup-success" class="success-message" style="display: none;"></div>
          <button type="submit" class="login-submit-button" id="signup-submit-btn">회원가입</button>

          <div class="divider">
            <span>또는</span>
          </div>

          <button type="button" id="google-signup-btn" class="google-signin-button">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            구글로 회원가입
          </button>
        </form>
      </div>
    </div>

    <script type="module" src="/static/login.js"></script>
  </body>
</html>
