<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Homework Checker</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <p class="eyebrow">Homework Pulse</p>
        <h1>숙제 검사 결과를 한눈에</h1>
        <p class="subtitle">
          업로드 → AI 채점 → Firebase 기록까지 한 번에 처리되는 토스 스타일 경험을 제공합니다.
        </p>
      </header>

      <section class="card hero">
        <div class="hero-text">
          <h2>학습 진행 현황</h2>
          <p class="hint">
            최근 결과와 누적 경험치가 실시간으로 반영됩니다. 세션별 기록은 Firebase에 저장돼요.
          </p>
          <div class="stats">
            <div class="stat">
              <p class="stat-label">레벨</p>
              <p class="stat-value" id="level">{{ state.level }}</p>
            </div>
            <div class="stat">
              <p class="stat-label">누적 XP</p>
              <p class="stat-value" id="experience">{{ state.total_xp }}</p>
            </div>
          </div>
        </div>
        <div class="character">
          <div class="avatar" id="avatar">
            <div class="face"></div>
          </div>
          <div>
            <p class="hint">레벨이 오를수록 캐릭터 분위기가 바뀝니다.</p>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>숙제 사진 업로드</h2>
        <form id="upload-form">
          <label class="upload-box" for="photo">
            <strong>사진 선택</strong>
            <p class="hint">PNG, JPG, WEBP 파일을 업로드할 수 있어요.</p>
            <input id="photo" name="photo" type="file" accept="image/png,image/jpeg,image/webp" required />
          </label>
          <button type="submit">업로드 & 검사</button>
        </form>
        <div class="result" id="result">
          <p class="hint">아직 제출된 결과가 없어요.</p>
        </div>
      </section>

      <section class="card split">
        <div>
          <h2>최근 제출 기록</h2>
          <ul class="history" id="history"></ul>
        </div>
        <div class="preview">
          <img id="preview" alt="최근 업로드 이미지 미리보기" />
          <p class="hint" id="preview-hint">이미지가 업로드되면 미리보기가 표시됩니다.</p>
        </div>
      </section>
    </div>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
