<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>숙제 검사 - Homework Checker</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 24px;
      }
      .card {
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 16px;
        max-width: 720px;
      }
      .row {
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }
      img {
        max-width: 240px;
        border-radius: 12px;
        border: 1px solid #eee;
      }
      .muted {
        color: #666;
        font-size: 14px;
      }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        background: #f2f2f2;
        margin-right: 8px;
      }
      button {
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid #ddd;
        cursor: pointer;
      }
      input[type="file"] {
        margin: 10px 0;
      }
      #error {
        color: #c00;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>숙제 검사</h2>
      <p class="muted">
        현재 상태:
        <span class="badge">레벨 <span id="level">{{ state.level }}</span></span>
        <span class="badge">누적 XP <span id="totalXp">{{ state.total_xp }}</span></span>
      </p>

      <form id="uploadForm">
        <input type="file" name="photo" accept="image/png,image/jpeg,image/webp" required />
        <div>
          <button type="submit">업로드 & 검사</button>
        </div>
      </form>

      <div id="error"></div>

      <hr style="margin:16px 0;" />

      <div class="row">
        <div>
          <img id="preview" alt="업로드 이미지 미리보기" style="display:none;" />
        </div>
        <div>
          <p><strong>점수:</strong> <span id="score">-</span></p>
          <p><strong>피드백:</strong> <span id="feedback">-</span></p>
          <p><strong>획득 XP:</strong> <span id="gainedXp">-</span></p>
        </div>
      </div>
    </div>

    <script src="/static/homework.js"></script>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
