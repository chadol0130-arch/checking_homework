<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>직독직해 연습</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      /* ────── 지문 읽기 화면 (passageCard) ────── */
      .passage-card {
        background: var(--card);
        border-radius: 20px;
        padding: 32px;
        box-shadow: var(--shadow);
        max-width: 720px;
        margin: 0 auto;
        display: none;
      }
      .passage-num-label {
        font-size: 12px;
        font-weight: 700;
        color: var(--primary);
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .passage-title-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 20px;
      }
      .passage-title-row h2 {
        margin: 0;
        font-size: 22px;
      }
      .passage-title-row .passage-sub {
        font-size: 14px;
        color: var(--muted);
      }
      .passage-text-body {
        font-size: 17px;
        line-height: 2.0;
        color: var(--text);
        padding: 22px 26px;
        background: #f8f9ff;
        border-radius: 14px;
        border-left: 4px solid var(--primary);
        margin-bottom: 24px;
        white-space: pre-wrap;
      }
      .passage-card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
      }
      .sentence-count-info {
        font-size: 13px;
        color: var(--muted);
        background: #f1f5f9;
        padding: 6px 14px;
        border-radius: 20px;
      }
      .btn-start-reading {
        background: var(--primary);
        color: #fff;
        border: none;
        padding: 12px 32px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn-start-reading:hover { background: #3a5eef; }

      .reading-card {
        background: var(--card);
        border-radius: 20px;
        padding: 32px;
        box-shadow: var(--shadow);
        max-width: 720px;
        margin: 0 auto;
      }
      .progress-bar-wrap {
        background: #e8ecf8;
        border-radius: 999px;
        height: 8px;
        margin-bottom: 24px;
        overflow: hidden;
      }
      .progress-bar-fill {
        background: linear-gradient(90deg, var(--primary), #7d8dff);
        height: 100%;
        border-radius: 999px;
        transition: width 0.4s ease;
      }
      .passage-label {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .english-sentence {
        font-size: 20px;
        font-weight: 600;
        line-height: 1.6;
        margin-bottom: 20px;
        padding: 16px 20px;
        background: #f0f4ff;
        border-radius: 12px;
        border-left: 4px solid var(--primary);
      }
      .hint-area {
        margin-bottom: 20px;
        min-height: 36px;
      }
      .hint-chunk {
        display: inline-block;
        background: #fff9e6;
        border: 1px solid #ffd166;
        border-radius: 8px;
        padding: 4px 10px;
        font-size: 14px;
        margin: 4px 4px 4px 0;
      }
      .hint-question {
        display: inline-block;
        background: #e6f7ff;
        border: 1px solid #7dd3fc;
        border-radius: 8px;
        padding: 4px 10px;
        font-size: 13px;
        color: #0369a1;
        margin: 4px 4px 4px 0;
      }
      .translation-input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #dde2f0;
        border-radius: 12px;
        font-size: 16px;
        outline: none;
        transition: border-color 0.2s;
        box-sizing: border-box;
      }
      .translation-input:focus { border-color: var(--primary); }
      .translation-input.correct { border-color: var(--success); background: #f0fff4; }
      .translation-input.wrong { border-color: var(--danger); background: #fff5f5; }
      .feedback-box {
        margin-top: 12px;
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 14px;
        display: none;
      }
      .feedback-box.pass { background: #d1fae5; color: #065f46; display: block; }
      .feedback-box.fail { background: #fee2e2; color: #991b1b; display: block; }
      .btn-row {
        display: flex;
        gap: 10px;
        margin-top: 20px;
        flex-wrap: wrap;
      }
      .btn-hint {
        background: #fff9e6;
        border: 1px solid #ffd166;
        color: #92400e;
        padding: 8px 16px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-hint:disabled { opacity: 0.4; cursor: not-allowed; }
      .btn-submit {
        background: var(--primary);
        color: #fff;
        border: none;
        padding: 10px 24px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        flex: 1;
      }
      .btn-submit:hover { background: #3a5eef; }
      .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
      .btn-next {
        background: var(--success);
        color: #fff;
        border: none;
        padding: 10px 24px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        display: none;
      }
      .xp-badge {
        background: var(--accent);
        color: #92400e;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
        display: none;
      }

      /* ────── 청크 모드 (Duolingo 스타일) ────── */
      .chunk-display { display: none; }
      .full-sentence-context {
        font-size: 15px;
        color: #9ca3af;
        line-height: 1.8;
        padding: 12px 16px;
        background: #f8f9fa;
        border-radius: 10px;
        margin-bottom: 14px;
      }
      .current-chunk-highlight {
        display: inline-block;
        background: #fef08a;
        border-radius: 10px;
        padding: 8px 18px;
        font-size: 22px;
        font-weight: 700;
        margin: 6px 0 16px;
        border-bottom: 3px solid #eab308;
        line-height: 1.5;
      }
      .chunk-input-area {
        margin-bottom: 4px;
      }
      .chunk-translation-input {
        border: none;
        border-bottom: 3px solid #ef4444;
        background: transparent;
        font-size: 19px;
        padding: 6px 4px;
        outline: none;
        width: 100%;
        max-width: 420px;
        color: #1e293b;
        font-family: inherit;
        transition: border-color 0.2s;
      }
      .chunk-translation-input::placeholder { color: #cbd5e1; }
      .chunk-translation-input.correct { border-bottom-color: #22c55e; color: #166534; }
      .chunk-translation-input.wrong   { border-bottom-color: #ef4444; color: #991b1b; }
      .completed-chunks {
        margin-top: 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: flex-start;
      }
      .completed-chunk-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }
      .completed-chunk-en {
        font-size: 12px;
        color: #6b7280;
        background: #f3f4f6;
        padding: 3px 10px;
        border-radius: 6px;
      }
      .completed-chunk-ko {
        font-size: 13px;
        color: #065f46;
        font-weight: 600;
      }
      .chunk-progress-dots {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
      }
      .chunk-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #e2e8f0;
        transition: background 0.2s;
      }
      .chunk-dot.done { background: #22c55e; }
      .chunk-dot.active { background: #eab308; }

      /* MCQ 화면 */
      .mcq-card {
        background: var(--card);
        border-radius: 20px;
        padding: 32px;
        box-shadow: var(--shadow);
        max-width: 720px;
        margin: 0 auto;
        display: none;
      }
      .mcq-option {
        padding: 12px 16px;
        border: 2px solid #dde2f0;
        border-radius: 10px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
        font-size: 15px;
      }
      .mcq-option:hover { border-color: var(--primary); background: #f0f4ff; }
      .mcq-option.selected { border-color: var(--primary); background: #eef2ff; }
      .mcq-option.correct { border-color: var(--success); background: #d1fae5; }
      .mcq-option.wrong-selected { border-color: var(--danger); background: #fee2e2; }

      /* 완료 화면 */
      .done-card {
        background: var(--card);
        border-radius: 20px;
        padding: 48px 32px;
        box-shadow: var(--shadow);
        max-width: 480px;
        margin: 0 auto;
        text-align: center;
        display: none;
      }
      .done-card .big-num {
        font-size: 64px;
        font-weight: 800;
        color: var(--primary);
        line-height: 1;
      }

      /* ────── 결과 검토 화면 ────── */
      .review-card {
        background: var(--card);
        border-radius: 20px;
        padding: 32px;
        box-shadow: var(--shadow);
        max-width: 720px;
        margin: 0 auto;
        display: none;
      }
      .review-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
      }
      .review-header h2 { margin: 0; }
      .btn-back-review {
        background: none;
        border: 1px solid #dde2f0;
        border-radius: 10px;
        padding: 8px 16px;
        font-size: 13px;
        cursor: pointer;
        color: var(--text);
      }
      .weakness-box {
        background: #fff7ed;
        border: 1px solid #fed7aa;
        border-radius: 14px;
        padding: 18px 20px;
        margin-bottom: 24px;
      }
      .weakness-box.perfect {
        background: #d1fae5;
        border-color: #6ee7b7;
        text-align: center;
        font-weight: 600;
        color: #065f46;
        font-size: 16px;
        padding: 22px;
      }
      .weakness-box h3 {
        margin: 0 0 14px;
        font-size: 15px;
        color: #c2410c;
      }
      .weakness-item {
        background: #fff;
        border-radius: 10px;
        padding: 10px 14px;
        margin-bottom: 10px;
        border-left: 3px solid #f97316;
      }
      .weakness-en {
        font-size: 14px;
        font-weight: 600;
        color: #1e293b;
        margin-bottom: 6px;
      }
      .weakness-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 13px;
      }
      .weakness-student { color: #991b1b; text-decoration: line-through; }
      .weakness-arrow { color: #9ca3af; }
      .weakness-model { color: #065f46; font-weight: 600; }
      .review-passage-section {
        border: 1px solid #e0e7ff;
        border-radius: 14px;
        margin-bottom: 16px;
        overflow: hidden;
      }
      .review-passage-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px;
        cursor: pointer;
        font-weight: 700;
        font-size: 15px;
        background: #f8f9ff;
        user-select: none;
      }
      .review-passage-header:hover { background: #eef2ff; }
      .review-passage-score {
        padding: 3px 12px;
        border-radius: 99px;
        font-size: 13px;
        font-weight: 700;
      }
      .review-passage-score.perfect { background: #d1fae5; color: #065f46; }
      .review-passage-score.good    { background: #fef9c3; color: #854d0e; }
      .review-passage-score.poor    { background: #fee2e2; color: #991b1b; }
      .review-passage-body { padding: 12px 18px; }
      .review-passage-body.hidden { display: none; }
      .review-sentence {
        border-radius: 10px;
        padding: 10px 14px;
        margin-bottom: 10px;
        border-left: 4px solid #e2e8f0;
      }
      .review-sentence.passed { border-left-color: #22c55e; background: #f0fff4; }
      .review-sentence.failed { border-left-color: #ef4444; background: #fff5f5; }
      .review-sentence-en {
        font-size: 14px;
        font-weight: 600;
        color: #1e293b;
        margin-bottom: 8px;
        line-height: 1.6;
      }
      .review-chunks {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 4px;
      }
      .review-chunk {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        flex-wrap: wrap;
      }
      .review-chunk-en {
        background: #f1f5f9;
        padding: 2px 10px;
        border-radius: 6px;
        color: #64748b;
        min-width: 80px;
      }
      .review-chunk-student { font-weight: 600; }
      .review-chunk.passed .review-chunk-student { color: #166534; }
      .review-chunk.failed .review-chunk-student { color: #991b1b; text-decoration: line-through; }
      .review-chunk-model { color: #065f46; font-size: 12px; }
      .review-legacy {
        font-size: 13px;
        color: #475569;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .review-stats-row {
        display: flex;
        gap: 16px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .review-stat {
        background: #f8f9ff;
        border-radius: 12px;
        padding: 12px 18px;
        text-align: center;
        flex: 1;
        min-width: 100px;
      }
      .review-stat-num {
        font-size: 28px;
        font-weight: 800;
        color: var(--primary);
        line-height: 1;
      }
      .review-stat-label {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <nav class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-mark">HW</div>
          <span>Homework Checker</span>
        </div>
        <div class="topbar-nav">
          <a href="/">대시보드</a>
          <a href="/exam" style="color:var(--primary); background:#eef2ff;">직독직해</a>
        </div>
      </div>
    </nav>

    <div class="container" style="padding-top:32px;">

      <!-- 지문 읽기 카드 (직독직해 시작 전) -->
      <div class="passage-card" id="passageCard">
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="passageProgressBar" style="width:0%"></div>
        </div>
        <div class="passage-num-label" id="passageNumLabel">20번 지문</div>
        <div class="passage-title-row">
          <h2>지문 읽기</h2>
          <span class="passage-sub">전체 지문을 먼저 읽고 직독직해를 시작하세요</span>
        </div>
        <div class="passage-text-body" id="passageTextBody"></div>
        <div class="passage-card-footer">
          <span class="sentence-count-info" id="sentenceCountInfo">문장 0개</span>
          <button class="btn-start-reading" onclick="startReading()">직독직해 시작 →</button>
        </div>
      </div>

      <!-- 직독직해 연습 카드 -->
      <div class="reading-card" id="readingCard">
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
        </div>
        <div class="passage-label" id="passageLabel"></div>

        <!-- 레거시 모드: 문장 전체 번역 -->
        <div id="legacyMode">
          <div class="english-sentence" id="englishSentence">로딩 중...</div>
          <div class="hint-area" id="hintArea"></div>
          <input type="text" class="translation-input" id="translationInput"
                 placeholder="직독직해로 번역해 보세요" autocomplete="off" />
        </div>

        <!-- 청크 모드: Duolingo 스타일 -->
        <div class="chunk-display" id="chunkDisplay">
          <div class="full-sentence-context" id="fullSentenceContext"></div>
          <div class="chunk-progress-dots" id="chunkDots"></div>
          <div class="current-chunk-highlight" id="currentChunk"></div>
          <div class="chunk-input-area">
            <input type="text" class="chunk-translation-input" id="chunkInput"
                   placeholder="번역 입력..." autocomplete="off" />
          </div>
          <div class="completed-chunks" id="completedChunks"></div>
        </div>

        <div class="feedback-box" id="feedbackBox"></div>
        <div class="btn-row">
          <button class="btn-hint" id="btnHint" onclick="showNextHint()">힌트 보기</button>
          <button class="btn-submit" id="btnSubmit" onclick="submitTranslation()">번역 제출</button>
          <button class="btn-next" id="btnNext" onclick="nextSentence()">다음 문장 →</button>
          <span class="xp-badge" id="xpBadge"></span>
        </div>
      </div>

      <!-- MCQ 카드 (지문 완독 후) -->
      <div class="mcq-card" id="mcqCard">
        <h3 id="mcqTitle" style="margin-top:0;"></h3>
        <div id="mcqQuestion" style="font-size:16px; margin-bottom:20px;"></div>
        <div id="mcqOptions"></div>
        <div class="btn-row" style="margin-top:16px;">
          <button class="btn-next" id="btnMcqNext" onclick="nextMcq()" style="display:none;">다음 문제 →</button>
        </div>
        <div id="mcqProgress" style="font-size:13px; color:var(--muted); margin-top:8px;"></div>
      </div>

      <!-- 완료 카드 -->
      <div class="done-card" id="doneCard">
        <div style="font-size:48px; margin-bottom:12px;">🎉</div>
        <h2>완료!</h2>
        <div class="big-num" id="doneScore">-</div>
        <div style="font-size:16px; color:var(--muted); margin:8px 0 24px;">정답률</div>
        <div style="font-size:18px; font-weight:700; color:var(--accent);">+<span id="doneTotalXp">0</span> XP 획득!</div>
        <div style="margin-top:28px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
          <a href="/exam" style="padding:10px 20px; border:1px solid #dde2f0; border-radius:10px; text-decoration:none; color:var(--text); font-weight:600;">목록으로</a>
          <button onclick="restart()" style="padding:10px 20px; background:var(--primary); color:#fff; border:none; border-radius:10px; font-weight:600; cursor:pointer;">다시 풀기</button>
          <button onclick="showReview()" style="padding:10px 20px; background:#f0fdf4; color:#166534; border:1px solid #86efac; border-radius:10px; font-weight:600; cursor:pointer;">결과 검토 →</button>
        </div>
      </div>

      <!-- 결과 검토 카드 -->
      <div class="review-card" id="reviewCard">
        <div class="review-header">
          <h2>결과 검토</h2>
          <button class="btn-back-review" onclick="document.getElementById('reviewCard').style.display='none'; document.getElementById('doneCard').style.display='block';">← 결과로</button>
        </div>
        <div class="review-stats-row" id="reviewStatsRow"></div>
        <div id="weaknessSummary"></div>
        <div id="reviewPassages"></div>
      </div>

    </div>

    <script>
      const EXAM = {{ exam | tojson }};

      // ─── 전역 상태 ───────────────────────────────────────────────
      let passageIdx = 0;
      let sentenceIdx = 0;
      let hintIdx = 0;
      let totalSentences = 0;
      let completedSentences = 0;
      let totalXp = 0;
      let correctCount = 0;
      let mcqIdx = 0;
      let mcqPassageIdx = 0;
      let mcqAnswers = [];

      // 청크 모드 전용 상태
      let chunkIdx = 0;
      let chunkResults = [];   // [{passed, korean, modelKorean}]

      // 세션 로그 (결과 검토용)
      let sessionLog = [];
      // 형식: [{passageNum, sentenceIdx, english, mode:'chunk'|'legacy',
      //         chunks:[{english,modelKorean,studentKorean,passed}], allPassed,
      //         studentKorean(legacy), modelAnswer(legacy), passed(legacy), score(legacy)}]

      EXAM.passages.forEach(p => { totalSentences += p.sentences.length; });

      function currentPassage() { return EXAM.passages[passageIdx]; }
      function currentSentence() { return currentPassage().sentences[sentenceIdx]; }
      function isChunkMode(sentence) {
        return sentence.chunks && sentence.chunks.length > 0;
      }

      // ─── 진행도 ────────────────────────────────────────────────
      function updateProgress() {
        const pct = totalSentences > 0 ? (completedSentences / totalSentences) * 100 : 0;
        document.getElementById('progressBar').style.width = pct + '%';
      }

      // ─── 문장 렌더링 (모드 분기) ────────────────────────────────
      function renderSentence() {
        const passage = currentPassage();
        const sentence = currentSentence();
        hintIdx = 0;
        chunkIdx = 0;
        chunkResults = [];

        // 공통 초기화
        document.getElementById('feedbackBox').className = 'feedback-box';
        document.getElementById('feedbackBox').textContent = '';
        document.getElementById('btnNext').style.display = 'none';
        document.getElementById('btnSubmit').style.display = '';
        document.getElementById('btnSubmit').disabled = false;
        document.getElementById('xpBadge').style.display = 'none';

        if (isChunkMode(sentence)) {
          renderChunkMode(passage, sentence);
        } else {
          renderLegacyMode(passage, sentence);
        }
      }

      // ─── 레거시 모드 ────────────────────────────────────────────
      function renderLegacyMode(passage, sentence) {
        document.getElementById('legacyMode').style.display = '';
        document.getElementById('chunkDisplay').style.display = 'none';
        document.getElementById('btnHint').style.display = '';

        document.getElementById('passageLabel').textContent =
          `지문 ${passageIdx + 1}/${EXAM.passages.length} · 문장 ${sentenceIdx + 1}/${passage.sentences.length}`;
        document.getElementById('englishSentence').textContent = sentence.english;
        document.getElementById('hintArea').innerHTML = '';
        document.getElementById('translationInput').value = '';
        document.getElementById('translationInput').className = 'translation-input';

        const hasHints = sentence.hints && sentence.hints.length > 0;
        document.getElementById('btnHint').disabled = !hasHints;
        document.getElementById('translationInput').focus();
      }

      function showNextHint() {
        const sentence = currentSentence();
        if (!sentence.hints || hintIdx >= sentence.hints.length) return;
        const hint = sentence.hints[hintIdx];
        hintIdx++;
        const area = document.getElementById('hintArea');
        const chunk = document.createElement('span');
        chunk.className = 'hint-chunk';
        chunk.textContent = hint.chunk || '';
        area.appendChild(chunk);
        if (hint.question) {
          const q = document.createElement('span');
          q.className = 'hint-question';
          q.textContent = hint.question;
          area.appendChild(q);
        }
        if (hintIdx >= sentence.hints.length) {
          document.getElementById('btnHint').disabled = true;
        }
      }

      // ─── 청크 모드 ────────────────────────────────────────────
      function renderChunkMode(passage, sentence) {
        document.getElementById('legacyMode').style.display = 'none';
        document.getElementById('chunkDisplay').style.display = '';
        document.getElementById('btnHint').style.display = 'none';  // 힌트 버튼 숨김

        document.getElementById('passageLabel').textContent =
          `지문 ${passageIdx + 1}/${EXAM.passages.length} · 문장 ${sentenceIdx + 1}/${passage.sentences.length}`;
        document.getElementById('fullSentenceContext').textContent = sentence.english;
        document.getElementById('completedChunks').innerHTML = '';

        renderChunkDots(sentence.chunks.length, 0);
        renderCurrentChunk(sentence);
      }

      function renderChunkDots(total, current) {
        const dotsEl = document.getElementById('chunkDots');
        dotsEl.innerHTML = '';
        for (let i = 0; i < total; i++) {
          const dot = document.createElement('div');
          dot.className = 'chunk-dot' + (i < current ? ' done' : i === current ? ' active' : '');
          dotsEl.appendChild(dot);
        }
      }

      function renderCurrentChunk(sentence) {
        const chunk = sentence.chunks[chunkIdx];
        document.getElementById('currentChunk').textContent = chunk.english;
        renderChunkDots(sentence.chunks.length, chunkIdx);

        const input = document.getElementById('chunkInput');
        input.value = '';
        input.className = 'chunk-translation-input';
        input.focus();

        document.getElementById('feedbackBox').className = 'feedback-box';
        document.getElementById('feedbackBox').textContent = '';
        document.getElementById('btnNext').style.display = 'none';
        document.getElementById('btnSubmit').style.display = '';
        document.getElementById('btnSubmit').disabled = false;
      }

      // ─── 번역 제출 (모드 분기) ────────────────────────────────
      async function submitTranslation() {
        const sentence = currentSentence();
        if (isChunkMode(sentence)) {
          await submitChunkTranslation(sentence);
        } else {
          await submitLegacyTranslation(sentence);
        }
      }

      async function submitChunkTranslation(sentence) {
        const input = document.getElementById('chunkInput');
        const korean = input.value.trim();
        if (!korean) { input.focus(); return; }

        document.getElementById('btnSubmit').disabled = true;

        const chunk = sentence.chunks[chunkIdx];
        const res = await fetch('/evaluate-translation', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            english: chunk.english,
            korean,
            model_answer: chunk.korean || '',
          }),
        });
        const data = await res.json();

        const feedbackBox = document.getElementById('feedbackBox');
        input.className = 'chunk-translation-input ' + (data.passed ? 'correct' : 'wrong');
        feedbackBox.className = 'feedback-box ' + (data.passed ? 'pass' : 'fail');

        chunkResults.push({ passed: data.passed, korean, modelKorean: chunk.korean });

        if (data.passed) {
          feedbackBox.textContent = '맞았어요! ✓';
          // 0.8초 후 자동으로 다음 청크 진행
          setTimeout(() => advanceChunk(sentence), 800);
        } else {
          feedbackBox.textContent = data.feedback || `참고: ${chunk.korean}`;
          document.getElementById('btnNext').textContent = '다음 청크 →';
          document.getElementById('btnNext').onclick = () => advanceChunk(sentence);
          document.getElementById('btnNext').style.display = 'inline-block';
          document.getElementById('btnSubmit').style.display = 'none';
        }
      }

      function advanceChunk(sentence) {
        // 완료된 청크를 하단에 추가
        const completedEl = document.getElementById('completedChunks');
        const chunk = sentence.chunks[chunkIdx];
        const result = chunkResults[chunkIdx];
        const item = document.createElement('div');
        item.className = 'completed-chunk-item';
        item.innerHTML =
          `<span class="completed-chunk-en">${escHtml(chunk.english)}</span>` +
          `<span class="completed-chunk-ko">${escHtml(result?.korean || chunk.korean)}</span>`;
        completedEl.appendChild(item);

        chunkIdx++;

        if (chunkIdx >= sentence.chunks.length) {
          // 문장의 모든 청크 완료
          const allPassed = chunkResults.every(r => r.passed);
          const xp = allPassed ? 30 : 10;
          totalXp += xp;
          if (allPassed) correctCount++;
          completedSentences++;

          // 세션 로그 기록
          sessionLog.push({
            passageNum: currentPassage().question_num,
            sentenceIdx,
            english: sentence.english,
            mode: 'chunk',
            chunks: sentence.chunks.map((c, i) => ({
              english: c.english,
              modelKorean: c.korean || '',
              studentKorean: chunkResults[i]?.korean || '',
              passed: chunkResults[i]?.passed ?? false,
            })),
            allPassed,
          });
          updateProgress();

          document.getElementById('xpBadge').textContent = `+${xp} XP`;
          document.getElementById('xpBadge').style.display = '';
          document.getElementById('btnNext').textContent = '다음 문장 →';
          document.getElementById('btnNext').onclick = nextSentence;
          document.getElementById('btnNext').style.display = 'inline-block';
          document.getElementById('btnSubmit').style.display = 'none';
          document.getElementById('currentChunk').textContent = '';
          document.getElementById('chunkInput').style.display = 'none';
          document.getElementById('feedbackBox').className = 'feedback-box pass';
          document.getElementById('feedbackBox').textContent = allPassed
            ? `🎉 완벽해요! +${xp} XP 획득!`
            : `문장 완료! +${xp} XP 획득`;
          renderChunkDots(sentence.chunks.length, sentence.chunks.length);
        } else {
          document.getElementById('chunkInput').style.display = '';
          renderCurrentChunk(sentence);
        }
      }

      async function submitLegacyTranslation(sentence) {
        const input = document.getElementById('translationInput');
        const korean = input.value.trim();
        if (!korean) { input.focus(); return; }

        document.getElementById('btnSubmit').disabled = true;

        const res = await fetch('/evaluate-translation', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            english: sentence.english,
            korean,
            model_answer: sentence.model_answer || '',
          }),
        });
        const data = await res.json();

        const feedbackBox = document.getElementById('feedbackBox');
        const inputEl = document.getElementById('translationInput');

        if (data.passed) {
          inputEl.className = 'translation-input correct';
          feedbackBox.className = 'feedback-box pass';
          feedbackBox.textContent = data.feedback;
          const xp = Math.max(10, 30 - hintIdx * 5);
          totalXp += xp;
          correctCount++;
          document.getElementById('xpBadge').textContent = `+${xp} XP`;
          document.getElementById('xpBadge').style.display = '';
        } else {
          inputEl.className = 'translation-input wrong';
          feedbackBox.className = 'feedback-box fail';
          feedbackBox.textContent = data.feedback;
        }

        completedSentences++;
        updateProgress();

        // 레거시 모드 세션 로그 기록
        sessionLog.push({
          passageNum: currentPassage().question_num,
          sentenceIdx,
          english: sentence.english,
          mode: 'legacy',
          studentKorean: korean,
          modelAnswer: sentence.model_answer || '',
          passed: data.passed,
          score: data.score || 0,
          feedback: data.feedback || '',
        });

        document.getElementById('btnNext').textContent = '다음 문장 →';
        document.getElementById('btnNext').onclick = nextSentence;
        document.getElementById('btnNext').style.display = 'inline-block';
        document.getElementById('btnSubmit').style.display = 'none';
      }

      // ─── 지문 읽기 화면 ─────────────────────────────────────
      function showPassage() {
        const passage = currentPassage();

        document.getElementById('passageCard').style.display = 'block';
        document.getElementById('readingCard').style.display = 'none';
        document.getElementById('mcqCard').style.display = 'none';

        document.getElementById('passageNumLabel').textContent =
          `${passage.question_num}번 지문 · ${passageIdx + 1}/${EXAM.passages.length}`;
        document.getElementById('passageTextBody').textContent = passage.original_text || passage.sentences.join(' ');
        document.getElementById('sentenceCountInfo').textContent =
          `문장 ${passage.sentences.length}개`;

        // 지문 단위 진행도 표시
        const pct = (passageIdx / EXAM.passages.length) * 100;
        document.getElementById('passageProgressBar').style.width = pct + '%';
      }

      function startReading() {
        document.getElementById('passageCard').style.display = 'none';
        document.getElementById('readingCard').style.display = 'block';
        sentenceIdx = 0;
        chunkIdx = 0;
        chunkResults = [];
        renderSentence();
      }

      // ─── 문장/지문 이동 ────────────────────────────────────────
      function nextSentence() {
        const passage = currentPassage();
        sentenceIdx++;
        if (sentenceIdx >= passage.sentences.length) {
          if (passage.comprehension_questions && passage.comprehension_questions.length > 0) {
            showMcq(passageIdx);
          } else {
            moveToNextPassage();
          }
        } else {
          renderSentence();
        }
      }

      function moveToNextPassage() {
        passageIdx++;
        sentenceIdx = 0;
        if (passageIdx >= EXAM.passages.length) {
          showDone();
        } else {
          showPassage();  // 다음 지문도 읽기 화면 먼저
        }
      }

      // ─── MCQ ──────────────────────────────────────────────────
      function showMcq(pIdx) {
        mcqPassageIdx = pIdx;
        mcqIdx = 0;
        mcqAnswers = [];
        document.getElementById('readingCard').style.display = 'none';
        document.getElementById('mcqCard').style.display = 'block';
        renderMcq();
      }

      function renderMcq() {
        const passage = EXAM.passages[mcqPassageIdx];
        const qs = passage.comprehension_questions;
        if (mcqIdx >= qs.length) {
          document.getElementById('mcqCard').style.display = 'none';
          document.getElementById('readingCard').style.display = 'block';
          passageIdx++;
          sentenceIdx = 0;
          if (passageIdx >= EXAM.passages.length) showDone();
          else renderSentence();
          return;
        }
        const q = qs[mcqIdx];
        document.getElementById('mcqTitle').textContent = `이해도 확인 (${mcqIdx + 1}/${qs.length})`;
        document.getElementById('mcqQuestion').textContent = q.question;
        document.getElementById('mcqProgress').textContent = `지문 ${mcqPassageIdx + 1} 완독 후 이해도 문제`;
        const opts = document.getElementById('mcqOptions');
        opts.innerHTML = '';
        (q.options || []).forEach((opt, i) => {
          const div = document.createElement('div');
          div.className = 'mcq-option';
          div.textContent = `${i + 1}. ${opt}`;
          div.onclick = () => selectMcqOption(i, q.correct_idx);
          opts.appendChild(div);
        });
        document.getElementById('btnMcqNext').style.display = 'none';
      }

      function selectMcqOption(selectedIdx, correctIdx) {
        if (document.querySelector('.mcq-option.correct')) return;
        const opts = document.querySelectorAll('.mcq-option');
        opts[correctIdx].className = 'mcq-option correct';
        if (selectedIdx !== correctIdx) {
          opts[selectedIdx].className = 'mcq-option wrong-selected';
        } else {
          totalXp += 20;
          correctCount++;
        }
        opts.forEach(o => o.onclick = null);
        document.getElementById('btnMcqNext').style.display = '';
      }

      function nextMcq() { mcqIdx++; renderMcq(); }

      // ─── 완료 화면 ────────────────────────────────────────────
      function showDone() {
        document.getElementById('readingCard').style.display = 'none';
        document.getElementById('mcqCard').style.display = 'none';
        document.getElementById('doneCard').style.display = 'block';
        const accuracy = totalSentences > 0
          ? Math.round((correctCount / totalSentences) * 100) : 0;
        document.getElementById('doneScore').textContent = accuracy + '%';
        document.getElementById('doneTotalXp').textContent = totalXp;

        // 세션 자동 저장 (백그라운드, 실패해도 무시)
        fetch(`/exam/${EXAM.exam_id}/session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_log: sessionLog, total_xp: totalXp, accuracy }),
        }).catch(() => {});
      }

      function restart() {
        passageIdx = 0; sentenceIdx = 0; hintIdx = 0;
        chunkIdx = 0; chunkResults = []; sessionLog = [];
        completedSentences = 0; totalXp = 0; correctCount = 0;
        document.getElementById('doneCard').style.display = 'none';
        document.getElementById('reviewCard').style.display = 'none';
        document.getElementById('readingCard').style.display = 'none';
        document.getElementById('chunkInput').style.display = '';
        updateProgress();
        showPassage();
      }

      // ─── 결과 검토 ──────────────────────────────────────────────
      function showReview() {
        document.getElementById('doneCard').style.display = 'none';
        document.getElementById('reviewCard').style.display = 'block';
        buildReview();
      }

      function buildReview() {
        // ── 통계 ──
        const totalEntries = sessionLog.length;
        const passedEntries = sessionLog.filter(e => e.allPassed !== undefined ? e.allPassed : e.passed).length;
        const totalChunks = sessionLog.reduce((s, e) => s + (e.chunks ? e.chunks.length : 1), 0);
        const passedChunks = sessionLog.reduce((s, e) => {
          if (e.chunks) return s + e.chunks.filter(c => c.passed).length;
          return s + (e.passed ? 1 : 0);
        }, 0);
        const accuracy = totalEntries > 0 ? Math.round(passedEntries / totalEntries * 100) : 0;

        document.getElementById('reviewStatsRow').innerHTML = `
          <div class="review-stat">
            <div class="review-stat-num">${accuracy}%</div>
            <div class="review-stat-label">문장 정답률</div>
          </div>
          <div class="review-stat">
            <div class="review-stat-num">${passedEntries}/${totalEntries}</div>
            <div class="review-stat-label">완벽한 문장</div>
          </div>
          <div class="review-stat">
            <div class="review-stat-num">${passedChunks}/${totalChunks}</div>
            <div class="review-stat-label">청크 정답</div>
          </div>
          <div class="review-stat">
            <div class="review-stat-num">${totalXp}</div>
            <div class="review-stat-label">획득 XP</div>
          </div>
        `;

        // ── 약점 분석 ──
        const failedItems = [];
        sessionLog.forEach(e => {
          if (e.mode === 'chunk') {
            e.chunks.forEach(c => {
              if (!c.passed) failedItems.push({ english: c.english, student: c.studentKorean, model: c.modelKorean, passageNum: e.passageNum });
            });
          } else if (!e.passed) {
            failedItems.push({ english: e.english, student: e.studentKorean, model: e.modelAnswer, passageNum: e.passageNum });
          }
        });

        const weakEl = document.getElementById('weaknessSummary');
        if (failedItems.length === 0) {
          weakEl.innerHTML = '<div class="weakness-box perfect">🎉 모든 청크를 완벽하게 번역했어요!</div>';
        } else {
          const shown = failedItems.slice(0, 6);
          weakEl.innerHTML = `
            <div class="weakness-box">
              <h3>약점 분석 — 틀린 청크 ${failedItems.length}개 중 상위 ${shown.length}개</h3>
              ${shown.map(item => `
                <div class="weakness-item">
                  <div class="weakness-en">${escHtml(item.english)}</div>
                  <div class="weakness-row">
                    <span class="weakness-student">${escHtml(item.student || '(미입력)')}</span>
                    <span class="weakness-arrow">→</span>
                    <span class="weakness-model">${escHtml(item.model || '')}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          `;
        }

        // ── 지문별 상세 ──
        const byPassage = {};
        sessionLog.forEach(e => {
          if (!byPassage[e.passageNum]) byPassage[e.passageNum] = [];
          byPassage[e.passageNum].push(e);
        });

        const passagesEl = document.getElementById('reviewPassages');
        passagesEl.innerHTML = '';
        Object.entries(byPassage).forEach(([num, entries]) => {
          const total = entries.length;
          const passed = entries.filter(e => e.allPassed !== undefined ? e.allPassed : e.passed).length;
          const scoreClass = passed === total ? 'perfect' : passed >= total / 2 ? 'good' : 'poor';
          const section = document.createElement('div');
          section.className = 'review-passage-section';
          const bodyId = `rbody-${num}`;
          section.innerHTML = `
            <div class="review-passage-header" onclick="document.getElementById('${bodyId}').classList.toggle('hidden')">
              <span>${num}번 지문</span>
              <span class="review-passage-score ${scoreClass}">${passed}/${total} 완벽</span>
            </div>
            <div class="review-passage-body" id="${bodyId}">
              ${entries.map(entry => {
                const isPassed = entry.allPassed !== undefined ? entry.allPassed : entry.passed;
                const chunkHtml = entry.mode === 'chunk'
                  ? `<div class="review-chunks">${entry.chunks.map(c => `
                      <div class="review-chunk ${c.passed ? 'passed' : 'failed'}">
                        <span class="review-chunk-en">${escHtml(c.english)}</span>
                        <span class="review-chunk-student">${escHtml(c.studentKorean || '?')}</span>
                        ${!c.passed ? `<span class="review-chunk-model">→ ${escHtml(c.modelKorean || '')}</span>` : ''}
                      </div>`).join('')}
                    </div>`
                  : `<div class="review-legacy">
                      <span>내 번역: ${escHtml(entry.studentKorean || '')}</span>
                      ${!entry.passed && entry.modelAnswer ? `<span>모범: ${escHtml(entry.modelAnswer)}</span>` : ''}
                    </div>`;
                return `
                  <div class="review-sentence ${isPassed ? 'passed' : 'failed'}">
                    <div class="review-sentence-en">${escHtml(entry.english)}</div>
                    ${chunkHtml}
                  </div>`;
              }).join('')}
            </div>
          `;
          passagesEl.appendChild(section);
        });
      }

      function escHtml(str) {
        return String(str)
          .replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      // 엔터키 제출 (레거시 모드)
      document.getElementById('translationInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          if (document.getElementById('btnSubmit').style.display !== 'none' &&
              !document.getElementById('btnSubmit').disabled) {
            submitTranslation();
          }
        }
      });

      // 엔터키 제출 (청크 모드)
      document.getElementById('chunkInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          if (document.getElementById('btnSubmit').style.display !== 'none' &&
              !document.getElementById('btnSubmit').disabled) {
            submitTranslation();
          }
        }
      });

      // ─── 초기화 ───────────────────────────────────────────────
      if (EXAM.passages.length > 0) {
        updateProgress();
        showPassage();  // 지문 읽기 화면 먼저
      } else {
        document.getElementById('readingCard').style.display = 'block';
        document.getElementById('englishSentence').textContent = '등록된 지문이 없습니다.';
      }
    </script>
  </body>
</html>
